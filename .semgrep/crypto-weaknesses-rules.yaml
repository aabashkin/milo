rules:
  - id: opcua-weak-rsa-key-size
    patterns:
      - pattern-either:
          - pattern: |
              generateRsaKeyPair(1024)
          - pattern: |
              generateRsaKeyPair(512)
          - pattern: |
              KeyPairGenerator.getInstance("RSA").initialize(1024)
          - pattern: |
              KeyPairGenerator.getInstance("RSA").initialize(512)
    message: >-
      Weak RSA key size detected. RSA keys smaller than 2048 bits are vulnerable to
      factorization attacks and do not meet modern security standards. Use at least
      2048-bit keys, preferably 4096-bit for long-term security.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf

  - id: opcua-sha1-algorithm-usage
    patterns:
      - pattern-either:
          - pattern: SecurityAlgorithm.HmacSha1
          - pattern: SecurityAlgorithm.RsaSha1
          - pattern: SecurityAlgorithm.Sha1
          - pattern: SecurityAlgorithm.PSha1
    message: >-
      SHA-1 cryptographic algorithm detected. SHA-1 is cryptographically broken and
      vulnerable to collision attacks. Use SHA-256 or SHA-512 based algorithms instead.
    severity: WARNING
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://shattered.io/

  - id: opcua-certificate-validation-disabled
    patterns:
      - pattern-either:
          - pattern: |
              new $VALIDATOR() {
                ...
                public void validateCertificateChain(...) {
                  // do nothing
                }
                ...
              }
          - pattern: |
              public void validateCertificateChain(...) {
                return;
              }
          - pattern: |
              setCertificateValidator(null)
    message: >-
      Certificate validation is disabled or bypassed. This allows man-in-the-middle
      attacks by accepting any certificate, including self-signed or expired ones.
      Always implement proper certificate validation.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln

  - id: opcua-trust-all-certificates
    patterns:
      - pattern-either:
          - pattern: |
              setCertificateValidator($VAR -> { })
          - pattern: |
              new CertificateValidator() {
                ...
                public void validateCertificateChain(...) throws UaException { }
                ...
              }
    message: >-
      Empty certificate validator implementation detected. This accepts all certificates
      without validation, allowing attackers to impersonate servers or clients.
      Implement proper certificate chain validation.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln

  - id: opcua-anonymous-identity-allowed
    patterns:
      - pattern-either:
          - pattern: AnonymousIdentityValidator
          - pattern: |
              new AnonymousIdentityValidator()
          - pattern: |
              setIdentityValidator(..., new AnonymousIdentityValidator())
    message: >-
      Anonymous authentication enabled. Allowing anonymous access removes authentication
      requirements, potentially exposing sensitive operations to unauthorized users.
      Only enable anonymous access for public read-only operations.
    severity: WARNING
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln

  - id: opcua-aes128-encryption
    patterns:
      - pattern-either:
          - pattern: SecurityAlgorithm.Aes128
          - pattern: SecurityPolicy.Basic128Rsa15
          - pattern: SecurityPolicy.Aes128_Sha256_RsaOaep
    message: >-
      AES-128 encryption detected. While still secure, AES-256 provides better long-term
      security with minimal performance impact. Consider using AES-256 based security
      policies for production systems.
    severity: INFO
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-326: Inadequate Encryption Strength"
      confidence: LOW
      likelihood: LOW
      impact: LOW
      subcategory:
        - vuln
