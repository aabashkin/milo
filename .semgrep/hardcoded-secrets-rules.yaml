rules:
  - id: opcua-hardcoded-keystore-password
    patterns:
      - pattern-either:
          - pattern: |
              char[] $VAR = "password".toCharArray();
          - pattern: |
              $VAR = "password".toCharArray()
          - pattern: |
              PASSWORD = "password".toCharArray()
    message: >-
      Hardcoded keystore password detected. Storing passwords directly in source code
      exposes cryptographic keys and certificates to unauthorized access. Use environment
      variables, secure configuration management, or secret vaults instead.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/798.html

  - id: opcua-hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: |
              "$USERNAME".equals($VAR) && "$PASSWORD".equals($VAR2)
          - pattern: |
              "user".equals($VAR) && "password1".equals($VAR2)
          - pattern: |
              "admin".equals($VAR) && "password2".equals($VAR2)
    message: >-
      Hardcoded authentication credentials detected. This creates a security vulnerability
      where credentials cannot be rotated and are visible in source code. Use secure
      credential storage like environment variables, configuration files with restricted
      permissions, or credential management systems.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln

  - id: opcua-password-tochararray-literal
    patterns:
      - pattern: |
          "...".toCharArray()
      - metavariable-regex:
          metavariable: $METHOD
          regex: .*password.*|.*Password.*|.*PASSWORD.*
      - pattern-inside: |
          $METHOD(..., "...".toCharArray(), ...)
    message: >-
      Hardcoded password detected in method call. Passwords should never be embedded
      in source code. Use secure configuration management, environment variables, or
      secrets management systems.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln

  - id: opcua-keystore-default-password
    patterns:
      - pattern-either:
          - pattern: |
              KeyStore.getInstance(...).load(..., "password".toCharArray())
          - pattern: |
              $KEYSTORE.load($STREAM, "password".toCharArray())
          - pattern: |
              $KEYSTORE.getKey($ALIAS, "password".toCharArray())
    message: >-
      Default or hardcoded keystore password detected. Using default passwords like
      'password' is a critical security vulnerability. Attackers can easily access
      private keys and certificates. Use strong, unique passwords stored securely.
    severity: ERROR
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      subcategory:
        - vuln

  - id: opcua-applicationuri-hardcoded
    patterns:
      - pattern: |
          setApplicationUri("urn:...")
      - pattern-not: |
          setApplicationUri($VAR)
    message: >-
      Hardcoded Application URI detected. Application URIs should be configurable
      to allow different instances to have unique identifiers. Consider using
      configuration files or environment variables.
    severity: WARNING
    languages:
      - java
    metadata:
      category: security
      cwe: "CWE-547: Use of Hard-coded, Security-relevant Constants"
      confidence: MEDIUM
      likelihood: LOW
      impact: LOW
      subcategory:
        - vuln
